# How each market reads a CV. `header_line` is the default status line under the contact
# details; it is editable per application in the UI, and the model never writes it.
# Placeholders come from the profile: {availability}, {city}, {country}, {nationality}, {timezone}.
# A " · " segment whose placeholder is empty is left out.
# `rules` go into the writing brief verbatim.

india:
  label: India
  spelling: Follow the JD's spelling for tool names (ReactJS vs React.js). For prose, use British spelling (optimise, organisation) consistently.
  max_pages: 2
  header_line: "{availability} · Open to {city}, hybrid or remote"
  show_nationality: false
  gdpr_clause: false
  rules:
    - Recruiters search Naukri, LinkedIn and internal ATS (Darwinbox, Zoho Recruit, Keka, Workday) by title, skills, total experience and notice period. The status line carries notice period; the summary carries total experience.
    - Indian JDs often list tools with their own spelling (NodeJS, ReactJS, Rest API). Mirror the JD spelling once in Skills; use the standard spelling elsewhere.
    - Services-company roles are read as "client + domain"; keep the client name and domain line. Product companies care about scale, ownership and outcomes; lead with those.
    - Do not include date of birth, marital status, father's name, photo, CTC or expected CTC. Never mention salary.
    - Startups read for end-to-end ownership, speed and breadth. Put the bullets that show owning a piece of work from start to finish first.

uk:
  label: United Kingdom
  spelling: British English throughout (optimise, organisation, programme, analyse, colour).
  max_pages: 2
  header_line: "Requires UK Skilled Worker visa sponsorship · Open to relocation · {availability}"
  show_nationality: false
  gdpr_clause: false
  rules:
    - It is a "CV", not a resume. No photo, date of birth, marital status, nationality line or references ("References available on request" is dated; omit it).
    - UK hiring managers discount superlatives. Prefer plain, specific verbs and the measured result. Understatement reads as confidence.
    - Visa sponsorship is filtered early. The status line states it plainly; do not repeat or apologise for it in the summary.
    - Use the JD's own wording for the role title; UK employers use their own conventions ("developer" and "engineer" are interchangeable, for example).

eu:
  label: European Union
  spelling: British English unless the JD is clearly American-English; never mix.
  max_pages: 2
  header_line: "Requires work permit (EU Blue Card) sponsorship · Open to relocation · {availability}"
  show_nationality: false
  gdpr_clause: true
  rules:
    - Write in English unless the JD is in another language and asks for that language. A German, Dutch or French JD written in English accepts an English CV.
    - Languages matter more in the EU: keep the Languages section and show the level in words (the profile's levels), exactly as the profile writes them; never raise one.
    - No photo by default. Date of birth and marital status are not needed; omit them.
    - Workplaces in Germany, the Netherlands and the Nordics value precision and modesty: concrete work, measured outcomes, no hype words.
    - The GDPR consent line at the end is required by Polish employers and harmless elsewhere; the candidate can switch it off.

uae:
  label: UAE / Dubai
  spelling: British English.
  max_pages: 2
  header_line: "{nationality} national · Requires UAE employment visa · Open to relocation to Dubai · {availability}"
  show_nationality: true
  gdpr_clause: false
  rules:
    - Gulf recruiters (often agencies) screen first on nationality, visa status and availability; the status line carries all three. Do not add a photo, age or marital status unless the candidate asks.
    - Agencies forward CVs to clients without the JD; the summary must make the candidate's role and seniority obvious on its own.
    - Enterprise, banking, government-tech and large-programme experience reads strongly in the UAE; surface enterprise scale, security compliance and stakeholder work when the JD supports it.

singapore:
  label: Singapore
  spelling: British English.
  max_pages: 2
  header_line: "{nationality} national · Requires Singapore Employment Pass · Open to relocation · {availability}"
  show_nationality: true
  gdpr_clause: false
  rules:
    - Employers weigh Employment Pass candidates against local hires (Fair Consideration Framework), so the CV must make the specialist depth obvious: put the strongest technical proof in the first two lines of the summary.
    - No photo, NRIC, age, race or religion (TAFEP guidelines discourage asking for these).
    - Regional-HQ roles value cross-team, cross-country collaboration; surface it where the profile supports it.

remote:
  label: Remote
  spelling: Match the JD's English variant (American for US companies, British for UK/EU); never mix.
  max_pages: 2
  header_line: "Remote from {city}, {country} ({timezone}) · {availability}"
  show_nationality: false
  gdpr_clause: false
  rules:
    - Remote-first teams read for written communication, async work and autonomy. Surface documentation, specs, and owning modules end to end where the profile supports it.
    - Hiring through an employer-of-record (Deel, Remote.com) is common for remote hires abroad; the CV does not need to mention it.
    - Mention distributed or remote collaboration only where the profile shows it.

anz:
  label: Australia / New Zealand
  spelling: British English (Australian and New Zealand English follow it).
  max_pages: 2
  header_line: "Requires employer visa sponsorship · Open to relocation · {availability}"
  show_nationality: false
  gdpr_clause: false
  rules:
    - Either "CV" or "resume" is fine. No photo, date of birth or marital status.
    - Work rights are screened first; the status line states sponsorship plainly. Do not repeat it in the summary.
    - ANZ hiring managers like plain, direct language and practical outcomes; avoid hype and corporate filler.
    - Referees are usually requested later in the process; do not add a referees section.

northamerica:
  label: US / Canada
  spelling: American English for US employers; Canadian employers accept American or British, so follow the JD.
  max_pages: 2
  header_line: "Requires visa sponsorship · Open to relocation · {availability}"
  show_nationality: false
  gdpr_clause: false
  rules:
    - It is a "resume". No photo, date of birth, marital status, nationality or age-revealing details (anti-discrimination norms).
    - US recruiters reward quantified impact and brevity: lead every bullet with the result where the profile has a number.
    - Sponsorship is screened early; the status line states it plainly.
