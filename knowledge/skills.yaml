# Skills taxonomy used by the keyword scorer (app/keywords.py).
# Each entry: Canonical name -> list of aliases. Matching is case-insensitive and
# boundary-aware ("React" does not match "Reactive"), except entries listed in
# `case_sensitive`, which must appear with exactly that casing (Go, R).
# The scorer is code, not the model: a JD term counts only if it appears here or
# the model lists it verbatim from the JD, and a CV covers it only if the text says it.

