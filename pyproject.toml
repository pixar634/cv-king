[project]
name = "jobmagnet"
description = "A local app that tailors your CV to each job, finds fresh jobs, and preps you for the interview."
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
target-version = "py312"
line-length = 130
extend-exclude = ["app/static/vendor"]

[tool.ruff.lint]
# Real mistakes only: syntax errors, undefined names, unused imports and variables, redefinitions.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
